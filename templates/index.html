<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Encryption & Decryption System</title>
    <!-- Tailwind CSS for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header -->
        <div class="bg-white p-6 rounded-lg shadow-md text-center">
            <h1 class="text-2xl font-bold text-gray-800">Secure File Encryption and Decryption</h1>
            <p class="text-gray-600 mt-1">AES-256-GCM & RSA-OAEP Cryptographic System</p>
            <div id="system-status" class="mt-2 text-sm text-green-600 font-semibold">Checking system status...</div>
        </div>

        <!-- Section 1: Key Generation -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">1. Generate RSA Key Pair</h2>
            <div class="flex items-center space-x-4">
                <label for="key-size" class="text-sm font-medium text-gray-600">Bit Length:</label>
                <select id="key-size" class="border border-gray-300 rounded px-3 py-2 text-sm">
                    <option value="2048">2048 bits</option>
                    <option value="3072" selected>3072 bits</option>
                    <option value="4096">4096 bits</option>
                </select>
                <button onclick="generateKeys()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 transition">Generate Keys</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Public Key (PEM):</label>
                    <textarea id="public-key-output" rows="4" class="w-full border rounded p-2 text-xs font-mono bg-gray-50" readonly placeholder="Generated public key will appear here..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Private Key (PEM):</label>
                    <textarea id="private-key-output" rows="4" class="w-full border rounded p-2 text-xs font-mono bg-gray-50" readonly placeholder="Generated private key will appear here..."></textarea>
                </div>
            </div>
        </div>

        <!-- Section 2: File Encryption -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">2. Encrypt File (.sfe)</h2>
            <form id="encrypt-form" onsubmit="handleEncrypt(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Select File to Encrypt (Max 16MB):</label>
                    <input type="file" id="encrypt-file" required class="w-full border border-gray-300 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Recipient Public Key (PEM or File):</label>
                    <textarea id="encrypt-public-key" rows="3" placeholder="Paste public key PEM here..." class="w-full border rounded p-2 text-xs font-mono mb-2"></textarea>
                    <input type="file" id="encrypt-public-key-file" class="text-sm">
                </div>
                <button type="submit" class="bg-green-600 text-white px-5 py-2 rounded text-sm hover:bg-green-700 transition">Encrypt & Download .sfe</button>
            </form>
        </div>

        <!-- Section 3: File Decryption -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">3. Decrypt Package (.sfe)</h2>
            <form id="decrypt-form" onsubmit="handleDecrypt(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Select .sfe Package File:</label>
                    <input type="file" id="decrypt-file" required class="w-full border border-gray-300 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Recipient Private Key (PEM or File):</label>
                    <textarea id="decrypt-private-key" rows="3" placeholder="Paste private key PEM here..." class="w-full border rounded p-2 text-xs font-mono mb-2"></textarea>
                    <input type="file" id="decrypt-private-key-file" class="text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Passphrase (Optional):</label>
                    <input type="password" id="decrypt-passphrase" placeholder="Enter passphrase if key is encrypted" class="w-full border border-gray-300 rounded p-2 text-sm">
                </div>
                <button type="submit" class="bg-purple-600 text-white px-5 py-2 rounded text-sm hover:bg-purple-700 transition">Decrypt & Download File</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Handling API Calls -->
    <script>
        // Check health on load
        fetch('/health')
            .then(res => res.json())
            .then(data => {
                document.getElementById('system-status').innerText = `System Status: ${data.status.toUpperCase()} (${data.crypto_engine})`;
            })
            .catch(() => {
                document.getElementById('system-status').innerText = 'System Status: Offline or Error connecting';
                document.getElementById('system-status').className = 'mt-2 text-sm text-red-600 font-semibold';
            });

        // Generate Keys Function
        async function generateKeys() {
            const keySize = document.getElementById('key-size').value;
            try {
                const response = await fetch('/api/keys/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key_size: parseInt(keySize) })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('public-key-output').value = data.public_key;
                    document.getElementById('private-key-output').value = data.private_key;
                    // Auto-fill public key for convenience
                    document.getElementById('encrypt-public-key').value = data.public_key;
                    document.getElementById('decrypt-private-key').value = data.private_key;
                    alert('Key pair generated successfully!');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Failed to connect to key generation endpoint.');
            }
        }

        // Handle Encryption Form Submission
        async function handleEncrypt(event) {
            event.preventDefault();
            const formData = new FormData();
            
            const fileInput = document.getElementById('encrypt-file').files[0];
            const pubKeyText = document.getElementById('encrypt-public-key').value;
            const pubKeyFile = document.getElementById('encrypt-public-key-file').files[0];

            if (!fileInput) return alert('Please choose a file to encrypt.');

            formData.append('file', fileInput);
            if (pubKeyText) formData.append('public_key', pubKeyText);
            if (pubKeyFile) formData.append('public_key_file', pubKeyFile);

            try {
                const response = await fetch('/api/encrypt', { method: 'POST', body: formData });
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileInput.name.substring(0, fileInput.name.lastIndexOf('.')) + '.sfe' || 'encrypted.sfe';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    alert('File encrypted successfully!');
                } else {
                    const errData = await response.json();
                    alert('Encryption Error: ' + errData.error);
                }
            } catch (err) {
                alert('An error occurred during encryption.');
            }
        }

        // Handle Decryption Form Submission
        async function handleDecrypt(event) {
            event.preventDefault();
            const formData = new FormData();

            const fileInput = document.getElementById('decrypt-file').files[0];
            const privKeyText = document.getElementById('decrypt-private-key').value;
            const privKeyFile = document.getElementById('decrypt-private-key-file').files[0];
            const passphrase = document.getElementById('decrypt-passphrase').value;

            if (!fileInput) return alert('Please choose an .sfe package file to decrypt.');

            formData.append('file', fileInput);
            if (privKeyText) formData.append('private_key', privKeyText);
            if (privKeyFile) formData.append('private_key_file', privKeyFile);
            if (passphrase) formData.append('passphrase', passphrase);

            try {
                const response = await fetch('/api/decrypt', { method: 'POST', body: formData });
                if (response.ok) {
                    const filenameHeader = response.headers.get('X-Decrypted-Filename') || 'decrypted_file';
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filenameHeader;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    alert('File decrypted successfully!');
                } else {
                    const errData = await response.json();
                    alert('Decryption Error: ' + errData.error);
                }
            } catch (err) {
                alert('An error occurred during decryption.');
            }
        }
    </script>
</body>
</html>
